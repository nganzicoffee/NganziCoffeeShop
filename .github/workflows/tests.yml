name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: nganzi_coffee
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_mysql, mbstring, xml, curl, bcmath, fileinfo, gd, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create Test Database
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS nganzi_test;"

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Verify storefront currency calculations
        run: node --test tests/frontend/price.test.mjs

      - name: Package tested production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-scripts
          git archive --format=tar --output="$RUNNER_TEMP/release.tar" HEAD
          tar -rf "$RUNNER_TEMP/release.tar" public/build vendor
          gzip "$RUNNER_TEMP/release.tar"

      - name: Save tested production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: spaceship-release
          path: ${{ runner.temp }}/release.tar.gz
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
