name: Legacy Ubuntu deployment (manual only)

on:
  # Spaceship uses a separate public directory and PHP binary. Keep automatic
  # deployment off until its workflow and dedicated credentials are configured.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check if Deployment Secrets are configured
        id: check_secrets
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Deployment secrets (SSH_HOST and SSH_KEY) are not set yet. Skipping automatic deployment."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Execute Remote Deployment via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /var/www/nganzicoffee.com
            bash deploy.sh
