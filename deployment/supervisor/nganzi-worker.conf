# -----------------------------------------------------------------------------
# Nganzi Coffee — Supervisor Queue Worker Configuration
# Place in: /etc/supervisor/conf.d/nganzi-worker.conf
# -----------------------------------------------------------------------------

[program:nganzi-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/nganzicoffee.com/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/nganzicoffee.com/storage/logs/worker.log
stopwaitsecs=3600
