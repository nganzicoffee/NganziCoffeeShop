# -----------------------------------------------------------------------------
# Nganzi Coffee — Nginx Virtual Host Configuration
# Domain: nganzicoffee.com & www.nganzicoffee.com
# -----------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name nganzicoffee.com www.nganzicoffee.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://nganzicoffee.com$request_uri;
}

# Redirect www to non-www on HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nganzicoffee.com;

    # ssl_certificate /etc/letsencrypt/live/nganzicoffee.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nganzicoffee.com/privkey.pem;

    return 301 https://nganzicoffee.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nganzicoffee.com;

    # SSL Certificate Paths (managed by Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/nganzicoffee.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nganzicoffee.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/nganzicoffee.com/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 12M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static Vite assets with long-term cache headers
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|webp|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60;
    }

    # Deny access to hidden files (e.g. .env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
